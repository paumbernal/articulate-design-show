[project]
name = "edge-lab"
version = "0.1.0"
description = "OrderFlow Edge Lab research engine: synthetic order-flow data, feature engineering, signal detection, the Edge Engine, and the backtesting/statistics engine."
requires-python = ">=3.11,<3.15"
dependencies = [
    "pydantic>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_lab"]
