    <script>
      // Applies the theme before first paint to avoid a flash of the wrong theme.
      // Defaults to dark; only an explicit stored "light" opts out.
      (function () {
        try {
          var stored = localStorage.getItem("pmb-theme");
          if (stored !== "light") document.documentElement.classList.add("dark");
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
